name: Update Dokka Documentation

on:
  workflow_dispatch: # Allows you to run this workflow manually from the GitHub Actions UI

permissions:
  contents: write # Needed to commit and push changes back to the repository

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Generate Dokka Docs
        run: ./gradlew dokkaGenerate --no-configuration-cache

      - name: Copy docs to /docs directory
        run: |
          # Clear old docs
          rm -rf docs/*
          
          # Copy newly generated HTML docs into the docs folder
          cp -R build/dokka/html/* docs/

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add docs/
          
          # Only commit and push if there are changes
          if git diff-index --quiet HEAD; then
            echo "No changes to documentation."
          else
            git commit -m "docs: auto-update Dokka documentation"
            git push
          fi
