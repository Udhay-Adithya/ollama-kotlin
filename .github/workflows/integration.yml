name: Integration

# Runs against a real Ollama server. Scheduled rather than per-PR because it downloads models,
# which is too slow and too network-dependent to gate every change on.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: 'Chat model to test against'
        required: false
        default: 'qwen3:0.6b'

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/ >/dev/null; then
              echo "ollama is up"
              exit 0
            fi
            sleep 2
          done
          echo "ollama failed to start within 60s"
          exit 1

      - name: Run integration tests
        env:
          OLLAMA_INTEGRATION_TESTS: 'true'
          OLLAMA_TEST_MODEL: ${{ inputs.model || 'qwen3:0.6b' }}
          OLLAMA_TEST_EMBED_MODEL: 'all-minilm'
        run: ./gradlew test --tests "org.udhay.ollama.integration.*" --no-configuration-cache

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: build/reports/tests/test/
          retention-days: 14
